services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agencia360
      POSTGRES_USER: agencia360
      POSTGRES_PASSWORD: agencia360
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Recibe los correos de desarrollo (códigos de recuperación de la app).
  # Bandeja en http://localhost:8025; la API envía por SMTP al puerto 1025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:

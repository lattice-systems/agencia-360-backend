name: CI

# Corre en cada PR hacia main y en cada push a main (al integrar). Las ramas de
# feature no corren con su push: las cubre su PR, así cada cambio se prueba una
# vez y no dos. Abre el PR temprano (aunque sea en borrador) para tener CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Si llegan varios push/commits seguidos a la misma rama o PR, cancela la corrida
# anterior: no tiene sentido esperar un build viejo si ya hay uno más nuevo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide si el PR toca código. Si solo cambia documentación (docs/ salvo el
  # contrato en docs/api/, plan/, .claude/, .githooks/ o archivos .md), los demás
  # jobs se saltan: un job saltado cuenta como aprobado para los checks
  # requeridos. En push a main y en ejecución manual siempre corre todo.
  cambios:
    name: Detectar cambios de código
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.revisar.outputs.codigo }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Revisar qué archivos cambiaron
        id: revisar
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" != "pull_request" ]; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # En un PR, HEAD es el merge de prueba: su primer padre es main.
          archivos=$(git diff --name-only HEAD^1 HEAD)
          echo "$archivos"
          if [ -z "$archivos" ] \
            || echo "$archivos" | grep -q '^docs/api/' \
            || echo "$archivos" | grep -Evq '^(docs/|plan/|\.claude/|\.githooks/)|\.md$'; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          else
            echo "Solo documentación: se saltan los demás jobs."
            echo "codigo=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build y pruebas (JDK 25)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compilar y correr pruebas (unitarias + Spring Modulith + Testcontainers)
        run: ./mvnw --no-transfer-progress -B verify

      - name: Publicar reportes de pruebas si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

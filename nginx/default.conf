server {
    listen 80;
    server_name _;
    # Manuales en PDF de hasta 20 MB.
    client_max_body_size 21m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # V2-M25.06: servicio web de pases de Apple Wallet (Apple fija la ruta /v1).
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /actuator/health {
        proxy_pass http://api:8080/actuator/health;
    }

    location = / {
        default_type application/json;
        return 200 '{"servicio":"API Agencia360","proxy":"Nginx","backend":"Spring Boot (Java 25)"}';
    }
}

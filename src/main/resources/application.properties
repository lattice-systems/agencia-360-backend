spring.application.name=backend-agencia360

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agencia360}
spring.datasource.username=${DB_USERNAME:agencia360}
spring.datasource.password=${DB_PASSWORD:agencia360}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Sobrescribir SIEMPRE vía variable de entorno fuera de dev; ver Azure Key Vault en la seccion 5 del documento de arquitectura.
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789-0123456789}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Usuarios iniciales (módulo acceso): se crean al arrancar solo si tienen valor y aún no existen.
# Sin valor por defecto a propósito: las contraseñas nunca van en el código.
app.acceso.administrador-inicial.usuario=${ADMIN_INICIAL_USUARIO:}
app.acceso.administrador-inicial.contrasena=${ADMIN_INICIAL_CONTRASENA:}
app.acceso.gerente-inicial.usuario=${GERENTE_INICIAL_USUARIO:}
app.acceso.gerente-inicial.contrasena=${GERENTE_INICIAL_CONTRASENA:}

springdoc.swagger-ui.path=/swagger-ui.html

# Manuales de la app CareCar (APP-3.1): solo PDF de hasta 20 MB. Mientras no
# haya Azure Blob Storage se guardan en una carpeta del servidor. El secreto
# firma las URL temporales; fuera de dev se sobrescribe SIEMPRE por variable.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# Dónde viven los PDF de los manuales: base (por omisión; sobrevive a reinicios) o local (carpeta).
app.manuales.almacen=${MANUALES_ALMACEN:base}
app.manuales.directorio=${MANUALES_DIRECTORIO:${java.io.tmpdir}/agencia360/manuales}
app.manuales.secreto=${MANUALES_SECRETO:dev-only-manuales-change-me-0123456789}

# V2-M02.11 · Llave que firma el QR del comprobante de la cita. Fuera de dev se
# sobrescribe SIEMPRE por variable (al menos 32 caracteres).
app.citas.qr-secreto=${CITAS_QR_SECRETO:dev-only-citas-qr-change-me-0123456789}

# V2-M25.03 · Pase de Wallet de la cita. Todo viene de variables de entorno y
# es opcional: sin ellas el arranque sigue normal y solo GET /citas/{id}/pase
# responde 503 WALLET_NO_CONFIGURADO. Los certificados y llaves van en base64.
app.wallet.apple.pass-type-id=${WALLET_APPLE_PASS_TYPE_ID:}
app.wallet.apple.team-id=${WALLET_APPLE_TEAM_ID:}
app.wallet.apple.cert-p12-base64=${WALLET_APPLE_CERT_P12_BASE64:}
app.wallet.apple.cert-password=${WALLET_APPLE_CERT_PASSWORD:}
app.wallet.apple.wwdr-pem-base64=${WALLET_APPLE_WWDR_PEM_BASE64:}
app.wallet.google.issuer-id=${WALLET_GOOGLE_ISSUER_ID:}
app.wallet.google.service-account-json-base64=${WALLET_GOOGLE_SERVICE_ACCOUNT_JSON_BASE64:}

management.endpoints.web.exposure.include=health,info
# Que un servidor de correo caído no marque la API como caída.
management.health.mail.enabled=false

# Remitente de los correos de la app CareCar.
app.correo.remitente=${CORREO_REMITENTE:CareCar <no-responder@agencia360.local>}

# La agencia vende una sola marca: el inventario no la guarda por unidad.
app.agencia.marca=${AGENCIA_MARCA:Nissan}

# Emisor de las facturas (ERP-1.3): datos fiscales de la agencia. Los valores
# por defecto son ficticios, solo para desarrollo.
app.facturacion.emisor.rfc=${FACTURA_EMISOR_RFC:AGE2401015K3}
app.facturacion.emisor.nombre=${FACTURA_EMISOR_NOMBRE:Agencia360 Automotriz S.A. de C.V.}
app.facturacion.emisor.domicilio-fiscal=${FACTURA_EMISOR_DOMICILIO:Blvd. Adolfo L\u00f3pez Mateos 1234, Col. Centro, C.P. 37000, Le\u00f3n, Gto.}
app.facturacion.emisor.regimen-fiscal=${FACTURA_EMISOR_REGIMEN:601 - General de Ley Personas Morales}

# V2-T05.04 · Enlace de recuperacion de contrasena que abre la app. Se le agrega
# ?token=<token de un solo uso>.
app.recuperacion.enlace=${RECUPERACION_ENLACE:carecar://restablecer-contrasena}

# APP-3.3 · Agenda de la app. Las franjas y su capacidad viven en la tabla
# franja_horario (V2-T05.07). El plazo de cancelacion (horas antes del inicio)
# esta pendiente del PO (PO-4): 24 h es un valor provisional.
app.agenda.horas-para-cancelar=${AGENDA_HORAS_PARA_CANCELAR:24}
app.agenda.dias-de-anticipacion=${AGENDA_DIAS_DE_ANTICIPACION:60}

# Asistente CareCar (V2-M24, ADR 0007). auto: Gemini si hay GEMINI_API_KEY; si no, el proveedor falso.
# El proyecto de Google es del plan gratis, sin facturación: una cuota agotada falla, no se cobra.
app.asistente.proveedor=${ASISTENTE_PROVEEDOR:auto}
app.asistente.gemini.llave=${GEMINI_API_KEY:}
app.asistente.modelo-texto=${ASISTENTE_MODELO_TEXTO:gemini-3.5-flash-lite}
app.asistente.modelo-embedding=${ASISTENTE_MODELO_EMBEDDING:gemini-embedding-2}
app.asistente.limite-por-cliente=${ASISTENTE_LIMITE_POR_CLIENTE:10}
app.asistente.limite-global=${ASISTENTE_LIMITE_GLOBAL:450}
app.asistente.indexado.automatico=${ASISTENTE_INDEXADO_AUTOMATICO:true}

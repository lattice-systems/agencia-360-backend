spring.jpa.show-sql=true
spring.flyway.clean-disabled=false

logging.level.dev.latticesystems.erp_agente360.backend_agencia360=DEBUG

# En local suelen correr el ERP y el CRM a la vez: el primero que arranca toma el
# puerto 5173 y Vite le da el 5174 al otro. Se permiten los dos.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Correos de la app (recuperación de contraseña): llegan a Mailpit, que se ve en http://localhost:8025
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

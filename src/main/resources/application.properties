spring.application.name=backend-agencia360

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agencia360}
spring.datasource.username=${DB_USERNAME:agencia360}
spring.datasource.password=${DB_PASSWORD:agencia360}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Sobrescribir SIEMPRE vía variable de entorno fuera de dev; ver Azure Key Vault en la seccion 5 del documento de arquitectura.
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789-0123456789}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Usuarios iniciales (módulo acceso): se crean al arrancar solo si tienen valor y aún no existen.
# Sin valor por defecto a propósito: las contraseñas nunca van en el código.
app.acceso.administrador-inicial.usuario=${ADMIN_INICIAL_USUARIO:}
app.acceso.administrador-inicial.contrasena=${ADMIN_INICIAL_CONTRASENA:}
app.acceso.gerente-inicial.usuario=${GERENTE_INICIAL_USUARIO:}
app.acceso.gerente-inicial.contrasena=${GERENTE_INICIAL_CONTRASENA:}

springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info

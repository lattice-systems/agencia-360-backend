spring.jpa.show-sql=false
spring.flyway.clean-disabled=true

logging.level.dev.latticesystems.erp_agente360.backend_agencia360=INFO

# La API es pública en internet: sin Swagger UI ni contrato OpenAPI en producción.
# Se consultan en local (perfil dev) en /swagger-ui.html y /v3/api-docs.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Si no hay ARCHIVOS_SECRETO, las URL de archivos se firman con el secreto de los
# manuales (cada firma lleva su propio prefijo), nunca con el valor de desarrollo.
app.archivos.secreto=${ARCHIVOS_SECRETO:${MANUALES_SECRETO}}

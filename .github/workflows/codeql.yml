name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Todos los lunes a las 06:00 UTC, además de en cada push/PR a main.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Análisis de CodeQL (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Compilar el proyecto (build manual para CodeQL)
        run: ./mvnw --no-transfer-progress -B -DskipTests package

      - name: Ejecutar el análisis de CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
